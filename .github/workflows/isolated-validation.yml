name: Isolated validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-validation:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: ai_collaboration_studio
    env:
      AI_STUDIO_SKIP_LOCAL_ENV: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      FUTU_HOST: "127.0.0.1"
      FUTU_PORT: "1"
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      GOOGLE_API_KEY: ""
      GEMINI_API_KEY: ""
      FUTU_PASSWORD_MD5: ""
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          architecture: "x64"

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ai_collaboration_studio/frontend/package-lock.json

      - name: Verify historical reader objects before offline tests
        env:
          GIT_NO_LAZY_FETCH: "1"
          AI_STUDIO_READER_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $readerCommits = @(
            '67fdb4ad548059506302298ee4d87846abfcece9',
            '25f61d00e3ec49e9034dfc3139033e4ff3b3487e',
            $env:AI_STUDIO_READER_CANDIDATE_SHA
          )
          foreach ($readerCommit in $readerCommits) {
            if ($readerCommit -notmatch '^[0-9a-f]{40}$') {
              throw 'historical reader commit identity is invalid'
            }
            git cat-file -e "${readerCommit}^{commit}"
            if ($LASTEXITCODE -ne 0) { throw "required reader object missing: $readerCommit" }
            git cat-file -e "${readerCommit}:ai_collaboration_studio/backend/store.py"
            if ($LASTEXITCODE -ne 0) { throw "required reader source missing: $readerCommit" }
            Write-Output "verified_reader_commit=$readerCommit"
          }

      - name: Deterministic offline security baseline
        shell: pwsh
        run: >-
          python scripts/run_static_security_checks.py
          --report "$env:RUNNER_TEMP\static-security.json"

      - name: Resolve guarded bootstrap runtime
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path ([System.IO.Path]::GetTempPath()) "ai-studio-bootstrap"
          "AI_STUDIO_BOOTSTRAP_ROOT=$runtimeRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Bootstrap locked dependencies and production frontend
        shell: pwsh
        run: >-
          python scripts/bootstrap_ai_collaboration_studio.py
          --runtime-root "$env:AI_STUDIO_BOOTSTRAP_ROOT"
          --report "$env:RUNNER_TEMP\bootstrap-receipt.json"
          --allow-dependency-downloads

      - name: Guarded frontend regression
        shell: pwsh
        run: npm.cmd --prefix frontend test

      - name: Required historical reader compatibility matrix
        env:
          AI_STUDIO_READER_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          & "$env:AI_STUDIO_BOOTSTRAP_ROOT\python\Scripts\python.exe"
          scripts/run_backend_tests_isolated.py
          tests.test_release_drill.ReleaseReaderDataContractTests
          --require-historical-readers
          --historical-reader-report "$env:RUNNER_TEMP\historical-reader-matrix.json"
          --verbosity 2

      - name: Full isolated backend regression
        shell: pwsh
        run: >-
          & "$env:AI_STUDIO_BOOTSTRAP_ROOT\python\Scripts\python.exe"
          scripts/run_backend_tests_isolated.py
          --layer full
          --verbosity 1
          --durations 30

      - name: Clean-source install, test, build, and startup smoke
        shell: pwsh
        run: >-
          python scripts/run_fresh_source_smoke.py
          --report "$env:RUNNER_TEMP\fresh-source-smoke.json"
          --allow-dependency-downloads

      - name: Isolated install, upgrade, and rollback drill
        shell: pwsh
        run: >-
          & "$env:AI_STUDIO_BOOTSTRAP_ROOT\python\Scripts\python.exe"
          scripts/run_isolated_release_drill.py
          --report "$env:RUNNER_TEMP\release-drill.json"

      - name: Generate offline dependency inventory
        shell: pwsh
        run: |
          $inventoryPath = Join-Path ([System.IO.Path]::GetTempPath()) (
            "ai-studio-dependency-inventory-" +
            [System.Guid]::NewGuid().ToString("N") +
            ".json"
          )
          $inventoryPython = "$env:AI_STUDIO_BOOTSTRAP_ROOT\python\Scripts\python.exe"
          & $inventoryPython `
            scripts/generate_dependency_inventory.py `
            --output "$inventoryPath"
          if ($LASTEXITCODE -ne 0) {
            throw "dependency inventory generation failed with exit code $LASTEXITCODE"
          }
          & $inventoryPython `
            scripts/generate_dependency_inventory.py `
            --verify "$inventoryPath"
          if ($LASTEXITCODE -ne 0) {
            throw "dependency inventory source verification failed with exit code $LASTEXITCODE"
          }
          $artifactPath = Join-Path $env:RUNNER_TEMP "dependency-inventory.json"
          [System.IO.File]::Copy(
            $inventoryPath,
            $artifactPath,
            $false
          )
          & $inventoryPython `
            scripts/generate_dependency_inventory.py `
            --verify "$artifactPath"
          if ($LASTEXITCODE -ne 0) {
            throw "dependency inventory artifact verification failed with exit code $LASTEXITCODE"
          }

      - name: Upload non-secret delivery receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolated-delivery-receipts
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}\static-security.json
            ${{ runner.temp }}\bootstrap-receipt.json
            ${{ runner.temp }}\fresh-source-smoke.json
            ${{ runner.temp }}\release-drill.json
            ${{ runner.temp }}\historical-reader-matrix.json
            ${{ runner.temp }}\dependency-inventory.json
